{% extends "base.html" %}

{% block title %}Compose - PyPG Mail{% endblock %}

{% block content %}
<div class="p-6 max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">New Message</h1>
        <a href="{{ url_for('emails.inbox') }}" class="text-gray-600 hover:text-gray-800">
            <i class="fas fa-times mr-2"></i>Discard
        </a>
    </div>
    
    <!-- Compose Form -->
    <form method="post" action="{{ url_for('emails.compose') }}" class="space-y-4">
        <div>
            <label for="to" class="block text-sm font-medium text-gray-700 mb-1">To</label>
            <input type="email" id="to" name="to" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                   value="{{ to }}">
        </div>
        
        <div>
            <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
            <input type="text" id="subject" name="subject" required 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                   value="{{ subject }}">
        </div>
        
        <div>
            <label for="body" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
            <textarea id="body" name="body" rows="15" 
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="Write your message here...">{{ body }}</textarea>
        </div>
        
        <div class="flex items-center justify-between pt-4">
            <div class="text-sm text-gray-500">
                <i class="fas fa-info-circle mr-1"></i>
                Emails will be delivered within 30-60 seconds
            </div>
            <div class="space-x-4">
                <button type="submit" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold">
                    <i class="fas fa-paper-plane mr-2"></i>Send
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
